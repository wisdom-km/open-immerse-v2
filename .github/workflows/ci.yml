name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Fetch main
        run: git fetch origin main

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: workers/parser
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Install worker Python
        working-directory: workers/parser
        run: uv python install

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Secret scan
        run: /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      - name: Check
        run: corepack pnpm run check
        env:
          GATE_BASE: origin/main

      - name: Unit tests
        run: corepack pnpm test
        env:
          GITLEAKS_BIN: /tmp/gitleaks

  python-worker:
    name: python-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/parser
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          working-directory: workers/parser
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Check uv pin
        run: |
          pinned="$(tr -d '[:space:]' < .uv-version)"
          grep -q "^required-version = \"${pinned}\"$" pyproject.toml

      - name: Install Python and sync dependencies
        run: |
          uv python install
          uv sync --frozen --extra dev

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ github.workspace }}/.nvmrc

      - name: Pyright
        run: uv run pyright
        env:
          PYRIGHT_PYTHON_FORCE_VERSION: "1.1.407"

      - name: Import linter
        run: uv run lint-imports

      - name: Pip licenses
        working-directory: ${{ github.workspace }}
        run: node tools/check-license/check-pip.mjs

      - name: Check PDF dependency pin
        run: |
          if grep -E '^name = "(pymupdf|pymupdf-fonts|fitz)"$' uv.lock; then
            echo "PyMuPDF is AGPL and must not be locked" >&2
            exit 1
          fi
          grep -q '^name = "pypdfium2"$' uv.lock
